worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Application routing, FastCGI parameters, static aliases, and gzip settings
    # follow the repository's nginx.conf. Only local listen/log paths differ.
    server {
        listen 8080;
        server_name meebible.org;
        root /www;

        gzip on;
        gzip_types application/x-javascript text/javascript text/plain text/xml application/xml text/css text/json;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_disable "msie6";
        gzip_comp_level 5;
        gzip_static on;
        gzip_vary on;

        location / {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME /www/route.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
        }

        location /static/ {
            alias /www/static/;
        }

        location = /favicon.ico {
            root /www/static/img/;
        }
    }
}
