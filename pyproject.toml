[project]
name = "meebible"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["api: in-process API integration tests with temporary SQLite databases"]
