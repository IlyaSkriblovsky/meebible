services:
  backend:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    build: .
    image: meebible-python:local
    user: "10001:10001"
    environment:
      MEEBIBLE_DATA_DIR: /data
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700,size=16m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${MEEBIBLE_PORT:-10001}:8000"
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/meta', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
